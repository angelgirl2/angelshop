name: Angel Shop Android Build

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        env:
          ANGELSHOP_CI_DEBUG_SIGNING: "true"
        run: >-
          flutter build apk --release
          --dart-define=ANGEL_GIRL__SHOP_API_URL=https://angel-shop.angelgirl2-bigsister-1383200784.workers.dev

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: angel-shop-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
